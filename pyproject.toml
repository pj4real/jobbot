[project]
name = "jobbot"
version = "0.3.0"
description = "Local off-campus job application pipeline. Finds openings in your mail, fills application forms, drafts outreach. Nothing sends without you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "pyyaml>=6.0",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.1",
  "google-auth-httplib2>=0.1.1",
  "playwright>=1.44",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.urls]
Source = "https://github.com/pj4real/jobbot"

[tool.jobbot]
# the four entry points, for anything that wants to discover them
entrypoints = ["find.py", "fill.py", "mail.py", "run.py"]
